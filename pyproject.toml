[project]
name = "automation-engine"
version = "0.2.3"
description = "Local Windows workflow automation engine with AI agent nodes"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28.1",
    "cryptography>=43",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "watchdog>=5",
    "websockets>=17.4",
    "pystray>=0.19.5",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]
# Browser automation uses the installed Microsoft Edge by default (no browser download).
browser = ["playwright>=1.64.1"]
# Desktop automation; add opencv-python for fuzzy image matching (confidence < 1).
desktop = ["pyautogui>=0.9.54", "pillow>=11"]
# Desktop window + packaging (build_windows.bat)
build = ["pywebview>=5", "pyinstaller>=6.22.3"]

[tool.setuptools.packages.find]
include = ["engine*", "database*", "backend*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
