name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include API keys, passwords or other secrets.
        For security problems, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an HTTP Request node with ...
        2. Run the workflow
        3. ...
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow JSON (optional)
      description: Export or copy the workflow if it helps reproduce the problem. Remove anything private first.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the log drawer or `%LOCALAPPDATA%\AutomationEngine\logs\service.log`.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under Settings → Updates. Say "source" plus the commit if running from git.
      placeholder: 0.2.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Installer
        - Portable zip
        - From source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
